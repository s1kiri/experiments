[tool.poetry]
name = "mapper-llm"
version = "0.1.0"
description = "Compression of text context into k vectors for LLM conditioning"
readme = "README.md"

# torch is NOT listed here — install it manually before `poetry install`
# because the wheel URL depends on CUDA version / CPU:
#
#   GPU (CUDA 12.1):  pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cu121
#   CPU / Mac:        pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
#
# After that: poetry install --no-root

[tool.poetry.dependencies]
python            = ">=3.9,<3.13"
pytorch-lightning = "2.6.0"
transformers      = "4.57.6"
tokenizers        = "0.22.2"
peft              = ">=0.10.0"
datasets          = "4.5.0"
evaluate          = "0.4.6"
nltk              = "3.9.2"
tensorboard       = "2.20.0"
tqdm              = "4.67.2"
pandas            = "2.3.3"
pyyaml            = "6.0.3"
numpy             = "2.0.2"
safetensors       = "0.7.0"
typing_extensions = "4.15.0"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
