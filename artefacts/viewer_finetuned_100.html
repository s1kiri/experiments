<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Просмотр предсказаний модели</title>
<style>
:root {
  --bg:        #f0f2f5;
  --card:      #ffffff;
  --border:    #e2e8f0;
  --text:      #1a202c;
  --muted:     #718096;
  --nar:       #4C72B0;
  --nar-light: #90afd4;
  --qa:        #DD8452;
  --qa-light:  #edaa7e;
  --match-bg:  #c6f6d5;
  --match-fg:  #22543d;
  --miss-bg:   #fed7d7;
  --miss-fg:   #742a2a;
  --beyond-fg: #a0aec0;
  --hdr:       #1e2a3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }

/* ── Header ── */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: var(--hdr); color: #fff;
  padding: 12px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.hdr-top { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.hdr h1 { font-size:17px; font-weight:700; letter-spacing:.3px; flex:1; min-width:200px; }
.controls { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

/* Tabs */
.tabs { display:flex; gap:4px; }
.tab {
  padding:5px 14px; border:1px solid rgba(255,255,255,.3);
  border-radius:20px; background:transparent; color:#cbd5e0;
  cursor:pointer; font-size:13px; transition:.15s;
}
.tab:hover { background:rgba(255,255,255,.1); color:#fff; }
.tab.active { background:#fff; color:var(--hdr); font-weight:600; border-color:#fff; }

/* Slider */
.slider-wrap { display:flex; align-items:center; gap:8px; font-size:13px; }
.slider-wrap label { white-space:nowrap; color:#a0aec0; }
.slider-wrap strong { color:#fff; min-width:28px; display:inline-block; }
input[type=range] { width:120px; accent-color:#63b3ed; cursor:pointer; }

/* Search */
.search-wrap input {
  padding:5px 10px; border-radius:6px; border:none;
  background:rgba(255,255,255,.12); color:#fff; font-size:13px;
  outline:none; width:200px;
}
.search-wrap input::placeholder { color:#a0aec0; }
.search-wrap input:focus { background:rgba(255,255,255,.2); }

/* Stats bar */
.stats-bar { font-size:12px; color:#718096; padding:5px 20px; background:#fff; border-bottom:1px solid var(--border); }

/* Metrics bar */
.metrics-bar {
  border-top:1px solid rgba(255,255,255,.1); padding:8px 20px;
  display:flex; gap:20px; flex-wrap:wrap; align-items:center;
}
.mg { display:flex; align-items:center; gap:12px; }
.mg-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; }
.mi { display:flex; flex-direction:column; gap:2px; }
.mi-label { font-size:10px; color:#a0aec0; }
.mi-row { display:flex; align-items:center; gap:7px; }
.mi-val { font-size:16px; font-weight:800; line-height:1; }
.mbar { width:72px; height:5px; background:rgba(255,255,255,.15); border-radius:3px; overflow:hidden; }
.mbar-fill { height:100%; border-radius:3px; transition:width .35s ease; }
.msep { width:1px; height:28px; background:rgba(255,255,255,.15); margin:0 4px; }

/* ── Content ── */
.content { max-width:1100px; margin:0 auto; padding:20px; }

/* ── Card ── */
.card {
  background:var(--card); border-radius:10px;
  border:1px solid var(--border); margin-bottom:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  overflow:hidden;
}
.card-hdr {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 16px; border-bottom:1px solid var(--border);
  background:#f7fafc;
}
.badge {
  font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px;
  text-transform:uppercase; letter-spacing:.5px;
}
.badge-nar  { background:var(--nar); color:#fff; }
.badge-qa   { background:var(--qa);  color:#fff; }
.card-id    { font-size:12px; color:var(--muted); font-family:monospace; }
.card-hdr-right { margin-left:auto; display:flex; align-items:center; gap:8px; }

/* Match badge (narrative) */
.mbadge {
  font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px;
}
.mbadge-good { background:#c6f6d5; color:#22543d; }
.mbadge-ok   { background:#fefcbf; color:#744210; }
.mbadge-bad  { background:#fed7d7; color:#742a2a; }

/* QA score badge */
.qbadge { font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px; }
.qbadge-exact { background:#c6f6d5; color:#22543d; }
.qbadge-good  { background:#bee3f8; color:#2a4365; }
.qbadge-ok    { background:#fefcbf; color:#744210; }
.qbadge-bad   { background:#fed7d7; color:#742a2a; }

/* ── Section ── */
.section { padding:12px 16px; border-bottom:1px solid var(--border); }
.section:last-child { border-bottom:none; }
.sec-label {
  font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.6px; color:var(--muted); margin-bottom:6px;
  display:flex; align-items:center; gap:8px;
}
.len-pill {
  font-size:10px; font-weight:500; padding:1px 7px; border-radius:10px;
  background:var(--bg); color:var(--muted); font-family:monospace; text-transform:none; letter-spacing:0;
}

/* ── Token text ── */
.tok-text {
  font-family: "SFMono-Regular", Consolas, monospace; font-size:13px;
  line-height:1.9; word-break:break-word;
}
.tok-text span { border-radius:3px; padding:1px 0; }
.tok-m  { background:var(--match-bg); color:var(--match-fg); }
.tok-x  { background:var(--miss-bg);  color:var(--miss-fg);  }
.tok-b  { color:var(--beyond-fg); }

/* Legend */
.legend {
  display:flex; gap:12px; flex-wrap:wrap;
  font-size:11px; color:var(--muted);
  padding:6px 16px 10px; align-items:center;
}
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }

/* Cutoff marker */
.cutoff-marker {
  display:inline-block; border-left:2px dashed #718096;
  margin:0 2px; height:1em; vertical-align:middle; opacity:.6;
}

/* ── Source preview (narrative) ── */
.src-preview {
  font-size:13px; line-height:1.7; color:#4a5568;
  max-height:80px; overflow:hidden; transition:max-height .3s ease;
  cursor:pointer;
}
.src-preview.expanded { max-height:500px; }
.expand-btn {
  font-size:11px; color:var(--nar); cursor:pointer;
  text-decoration:underline; margin-top:4px; display:inline-block;
}

/* ── QA layout ── */
.qa-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:640px) { .qa-grid { grid-template-columns:1fr; } }
.qa-box {
  border:1px solid var(--border); border-radius:8px; padding:10px 12px;
  font-size:13px; line-height:1.6;
}
.qa-box.exact-match { border-color:#68d391; background:#f0fff4; }
.qa-box.good-match  { border-color:#90cdf4; background:#ebf8ff; }
.qa-box.bad-match   { border-color:#fc8181; background:#fff5f5; }
.qa-box-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:4px; }

.question-box {
  background:#fffbeb; border:1px solid #f6e05e; border-radius:8px;
  padding:10px 14px; font-size:14px; font-weight:500; color:#744210;
  line-height:1.5;
}
mark.ans-hl {
  background:#fefcbf; color:#744210; border-radius:2px;
  padding:1px 2px; font-weight:600;
}

/* ── Pagination ── */
.pagination {
  display:flex; justify-content:center; align-items:center;
  gap:8px; padding:24px 0 40px;
}
.pg-btn {
  padding:7px 18px; border-radius:8px; border:1px solid var(--border);
  background:var(--card); cursor:pointer; font-size:13px; color:var(--text);
  transition:.15s;
}
.pg-btn:hover:not(:disabled) { background:var(--nar); color:#fff; border-color:var(--nar); }
.pg-btn:disabled { opacity:.4; cursor:not-allowed; }
.pg-info { font-size:13px; color:var(--muted); padding:0 8px; }

/* Empty */
.empty { text-align:center; padding:60px; color:var(--muted); font-size:15px; }
</style>
</head>

estion":"What did Senator Heinrich's bill require?","answer":"a binding referendum to be held in Puerto Rico asking whether the territory wants to be admitted as a state.","prediction":"a binding referendum","exact":0,"f1":0.261},{"task":"qa","id":"qa_0097350","source_text":"Hamas has continued to be a major player in Palestine. From 2000 to 2007 it killed 542 people in 140 suicide bombing or \"martyrdom operations\". In the January 2006 legislative election—its first foray into the political process—it won the majority of the seats, and in 2007 it drove the PLO out of Gaza. Hamas has been praised by Muslims for driving Israel out of the Gaza Strip, but criticized for failure to achieve its demands in the 2008-9 and 2014 Gaza Wars despite heavy destruction and significant loss of life.","question":"What did Hamas win in the January 2006 legislative election?","answer":"majority of the seats,","prediction":"first term","exact":0,"f1":0.0},{"task":"qa","id":"qa_0036591","source_text":"On 2 July 2012, GlaxoSmithKline pleaded guilty to criminal charges and agreed to a $3 billion settlement of the largest health-care fraud case in the U.S. and the largest payment by a drug company. The settlement is related to the company's illegal promotion of prescription drugs, its failure to report safety data, bribing doctors, and promoting medicines for uses for which they were not licensed. The drugs involved were Paxil, Wellbutrin, Advair, Lamictal, and Zofran for off-label, non-covered uses. Those and the drugs Imitrex, Lotronex, Flovent, and Valtrex were involved in the kickback scheme.","question":"What was one of the causes of the health-care fraud case?","answer":"illegal promotion of prescription drugs","prediction":"illegal promotion of prescription drugs","exact":1,"f1":1.0},{"task":"qa","id":"qa_0058469","source_text":"A boy who is late for any division or other appointment may be required to sign \"Tardy Book\", a register kept in the School Office, between 7.35am and 7.45am, every morning for the duration of his sentence (typically three days). Tardy Book may also be issued for late work. For more serious misdeeds, a boy is summoned from his lessons to the Head Master, or Lower Master if the boy is in the lower two years, to talk personally about his misdeeds. This is known as the \"Bill\". The most serious misdeeds may result in expulsion, or rustication (suspension). Conversely, should a master be more than 15 minutes late for a class, traditionally the pupils might claim it as a \"run\" and absent themselves for the rest of its duration.","question":"What is another term for rustication?","answer":"suspension","prediction":"suspension","exact":1,"f1":1.0},{"task":"qa","id":"qa_0068394","source_text":"However, in English, the term madrasah usually refers to the specifically Islamic institutions. A typical Islamic school usually offers two courses of study: a ḥifẓ course teaching memorization of the Qur'an (the person who commits the entire Qurʼan to memory is called a ḥāfiẓ); and an ʻālim course leading the candidate to become an accepted scholar in the community. A regular curriculum includes courses in Arabic, tafsir (Qur'anic interpretation), sharīʻah (Islamic law), hadiths (recorded sayings and deeds of Muhammad), mantiq (logic), and Muslim history. In the Ottoman Empire, during the Early Modern Period, the study of hadiths was introduced by Süleyman I. Depending on the educational demands, some madaris also offer additional advanced courses in Arabic literature, English and other foreign languages, as well as science and world history. Ottoman madaris along with religious teachings also taught \"styles of writing, grammary, syntax, poetry, composition, natural sciences, political sciences, and etiquette.\"","question":"What set of courses does someone need to take for preparation to be considered as a scholar?","answer":"ʻālim","prediction":"tāḥīʻ","exact":0,"f1":0.0},{"task":"qa","id":"qa_0030600","source_text":"A thorough understanding of adolescence in society depends on information from various perspectives, including psychology, biology, history, sociology, education, and anthropology. Within all of these perspectives, adolescence is viewed as a transitional period between childhood and adulthood, whose cultural purpose is the preparation of children for adult roles. It is a period of multiple transitions involving education, training, employment and unemployment, as well as transitions from one living circumstance to another.","question":"A thorough understanding of adolescence in society depends on what?","answer":"information from various perspectives, including psychology, biology, history, sociology, education, and anthropology.","prediction":"independent of information from other perspectives","exact":0,"f1":0.222},{"task":"qa","id":"qa_0155980","source_text":"Uses of a sequence of events include stories, historical events (chronology), directions and steps in procedures, and timetables for scheduling activities. A sequence of events may also be used to help describe processes in science, technology, and medicine. A sequence of events may be focused on past events (e.g., stories, history, chronology), on future events that must be in a predetermined order (e.g., plans, schedules, procedures, timetables), or focused on the observation of past events with the expectation that the events will occur in the future (e.g., processes). The use of a sequence of events occurs in fields as diverse as machines (cam timer), documentaries (Seconds From Disaster), law (choice of law), computer simulation (discrete event simulation), and electric power transmission (sequence of events recorder). A specific example of a sequence of events is the timeline of the Fukushima Daiichi nuclear disaster.","question":"Uses of sequences of events include what?","answer":"stories, historical events (chronology), directions and steps in procedures, and timetables","prediction":"stories, historical events (chronology), directions and steps in procedures","exact":0,"f1":0.8},{"task":"qa","id":"qa_0103355","source_text":"Regarding the monastic rules, the Buddha constantly reminds his hearers that it is the spirit that counts. On the other hand, the rules themselves are designed to assure a satisfying life, and provide a perfect springboard for the higher attainments. Monastics are instructed by the Buddha to live as \"islands unto themselves\". In this sense, living life as the vinaya prescribes it is, as one scholar puts it: \"more than merely a means to an end: it is very nearly the end in itself.\"","question":"Monastics are instructed by the Buddha to live as what?","answer":"islands unto themselves","prediction":"islands themselves","exact":0,"f1":0.8},{"task":"qa","id":"qa_0121741","source_text":"Because of the general instability of the federal government during 1828, the installation of the new legislature did not take place until the middle of the following year. It was quickly dissolved by Governor Santiago de Baca Ortiz, who replaced it with a more pronounced Yorkino type. When Guerrero's liberal administration was overthrown in December, Gaspar de Ochoa aligned with Anastasio Bustamante, and in February 1830, organized an opposition group that arrested the new governor, F. Elorriaga, along with other prominent Yorkinos. He then summoned the legislature, which had been dissolved by Baca. The civil and military authorities were now headed by J. A. Pescador and Simón Ochoa.","question":"Who dissolved the government eventually?","answer":"Governor Santiago de Baca Ortiz","prediction":"Santiago de Baca Ortiz","exact":0,"f1":0.889},{"task":"qa","id":"qa_0152241","source_text":"It criticised Forsyth's decision to record a conversation with Harry as an abuse of teacher–student confidentiality and said \"It is clear whichever version of the evidence is accepted that Mr Burke did ask the claimant to assist Prince Harry with text for his expressive art project ... It is not part of this tribunal's function to determine whether or not it was legitimate.\" In response to the tribunal's ruling concerning the allegations about Prince Harry, the School issued a statement, saying Forsyth's claims \"were dismissed for what they always have been - unfounded and irrelevant.\" A spokesperson from Clarence House said, \"We are delighted that Harry has been totally cleared of cheating.\"","question":"The School dismissed claims that Prince Harry was cheating by saying the claims were what?","answer":"unfounded and irrelevant","prediction":"unfounded and irrelevant","exact":1,"f1":1.0},{"task":"qa","id":"qa_0000115","source_text":"The Rev. John J. Cavanaugh, C.S.C. served as president from 1946 to 1952. Cavanaugh's legacy at Notre Dame in the post-war years was devoted to raising academic standards and reshaping the university administration to suit it to an enlarged educational mission and an expanded student body and stressing advanced studies and research at a time when Notre Dame quadrupled in student census, undergraduate enrollment increased by more than half, and graduate student enrollment grew fivefold. Cavanaugh also established the Lobund Institute for Animal Studies and Notre Dame's Medieval Institute. Cavanaugh also presided over the construction of the Nieuwland Science Hall, Fisher Hall, and the Morris Inn, as well as the Hall of Liberal Arts (now O'Shaughnessy Hall), made possible by a donation from I.A. O'Shaughnessy, at the time the largest ever made to an American Catholic university. Cavanaugh also established a system of advisory councils at the university, which continue today and are vital to the university's governance and development","question":"What is O'Shaughnessy Hall of Notre Dame formerly known as?","answer":"Hall of Liberal Arts","prediction":"O'Shaughnessy Hall of Arts","exact":0,"f1":0.75},{"task":"qa","id":"qa_0011403","source_text":"On October 7, 2003, the recall election resulted in Governor Gray Davis being removed from office with 55.4% of the Yes vote in favor of a recall. Schwarzenegger was elected Governor of California under the second question on the ballot with 48.6% of the vote to choose a successor to Davis. Schwarzenegger defeated Democrat Cruz Bustamante, fellow Republican Tom McClintock, and others. His nearest rival, Bustamante, received 31% of the vote. In total, Schwarzenegger won the election by about 1.3 million votes. Under the regulations of the California Constitution, no runoff election was required. Schwarzenegger was the second foreign-born governor of California after Irish-born Governor John G. Downey in 1862.","question":"Who was Schwarzenegger's closest rival in the gubernatorial race of 2003?","answer":"Cruz Bustamante","prediction":"Tom McConnik","exact":0,"f1":0.0},{"task":"qa","id":"qa_0068085","source_text":"In 1984, he was appointed a member of the Order of the Companions of Honour by Queen Elizabeth II on the advice of Prime Minister Margaret Thatcher for his \"services to the study of economics\". He was the first recipient of the Hanns Martin Schleyer Prize in 1984. He also received the US Presidential Medal of Freedom in 1991 from President George H. W. Bush. In 2011, his article \"The Use of Knowledge in Society\" was selected as one of the top 20 articles published in The American Economic Review during its first 100 years.","question":"What award was Hayek the first to receive?","answer":"Hanns Martin Schleyer Prize","prediction":"Nobel Peace Prize","exact":0,"f1":0.286},{"task":"qa","id":"qa_0163602","source_text":"Before Europeans arrived, the Philadelphia area was home to the Lenape (Delaware) Indians in the village of Shackamaxon. The Lenape are a Native American tribe and First Nations band government. They are also called Delaware Indians and their historical territory was along the Delaware River watershed, western Long Island and the Lower Hudson Valley.[a] Most Lenape were pushed out of their Delaware homeland during the 18th century by expanding European colonies, exacerbated by losses from intertribal conflicts. Lenape communities were weakened by newly introduced diseases, mainly smallpox, and violent conflict with Europeans. Iroquois people occasionally fought the Lenape. Surviving Lenape moved west into the upper Ohio River basin. The American Revolutionary War and United States' independence pushed them further west. In the 1860s, the United States government sent most Lenape remaining in the eastern United States to the Indian Territory (present-day Oklahoma and surrounding territory) under the Indian removal policy. In the 21st century, most Lenape now reside in the US state of Oklahoma, with some communities living also in Wisconsin, Ontario (Canada) and in their traditional homelands.","question":"Where do the Lenape reside today?","answer":"Oklahoma","prediction":"Indian Territory","exact":0,"f1":0.0},{"task":"qa","id":"qa_0020186","source_text":"On September 15, 2007, Witon Barry (of the Tobolar Copra processing plant in the Marshall Islands capital of Majuro) said power authorities, private companies, and entrepreneurs had been experimenting with coconut oil as alternative to diesel fuel for vehicles, power generators, and ships. Coconut trees abound in the Pacific's tropical islands. Copra, the meat of the coconut, yields coconut oil (1 liter for every 6 to 10 coconuts). In 2009, a 57 kW solar power plant was installed, the largest in the Pacific at the time, including New Zealand. It is estimated that 330 kW of solar and 450 kW of wind power would be required to make the College of the Marshall Islands energy self-sufficient. Marshalls Energy Company (MEC), a government entity, provides the islands with electricity. In 2008, 420 solar home systems of 200 Wp each were installed on Ailinglaplap Atoll, sufficient for limited electricity use.","question":"Who did Witon Barry work for?","answer":"the Tobolar Copra processing plant","prediction":"Majuro","exact":0,"f1":0.0},{"task":"qa","id":"qa_0124802","source_text":"By far the largest military action in which the United States engaged during this era was the War of 1812. With Britain locked in a major war with Napoleon's France, its policy was to block American shipments to France. The United States sought to remain neutral while pursuing overseas trade. Britain cut the trade and impressed seamen on American ships into the Royal Navy, despite intense protests. Britain supported an Indian insurrection in the American Midwest, with the goal of creating an Indian state there that would block American expansion. The United States finally declared war on the United Kingdom in 1812, the first time the U.S. had officially declared war. Not hopeful of defeating the Royal Navy, the U.S. attacked the British Empire by invading British Canada, hoping to use captured territory as a bargaining chip. The invasion of Canada was a debacle, though concurrent wars with Native Americans on the western front (Tecumseh's War and the Creek War) were more successful. After defeating Napoleon in 1814, Britain sent large veteran armies to invade New York, raid Washington and capture the key control of the Mississippi River at New Orleans. The New York invasion was a fiasco after the much larger British army retreated to Canada. The raiders succeeded in the burning of Washington on 25 August 1814, but were repulsed in their Chesapeake Bay Campaign at the Battle of Baltimore and the British commander killed. The major invasion in Louisiana was stopped by a one-sided military battle that killed the top three British generals and thousands of soldiers. The winners were the commanding general of the Battle of New Orleans, Major General Andrew Jackson, who became president and the Americans who basked in a victory over a much more powerful nation. The peace treaty proved successful, and the U.S. and Britain never again went to war. The losers were the Indians, who never gained the independent territory in the Midwest promised by Britain.","question":"What country was the first the US ever declared war upon?","answer":"the United Kingdom","prediction":"the United Kingdom","exact":1,"f1":1.0},{"task":"qa","id":"qa_0022199","source_text":"Zhejiang consists mostly of hills, which account for about 70% of its total area. Altitudes tend to be the highest to the south and west and the highest peak of the province, Huangmaojian Peak (1,929 meters or 6,329 feet), is located there. Other prominent mountains include Mounts Yandang, Tianmu, Tiantai, and Mogan, which reach altitudes of 700 to 1,500 meters (2,300 to 4,900 ft).","question":"What percent of Zhejiang is hills?","answer":"70%","prediction":"70%","exact":1,"f1":1.0},{"task":"qa","id":"qa_0172147","source_text":"The Eastern Roman Empire – today conventionally named the Byzantine Empire, a name not in use during its own time – became increasingly influenced by Greek culture after the 7th century, when Emperor Heraclius (AD 575 - 641) decided to make Greek the empire's official language. Certainly from then on, but likely earlier, the Roman and Greek cultures were virtually fused into a single Greco-Roman world. Although the Latin West recognized the Eastern Empire's claim to the Roman legacy for several centuries, after Pope Leo III crowned Charlemagne, king of the Franks, as the \"Roman Emperor\" on 25 December 800, an act which eventually led to the formation of the Holy Roman Empire, the Latin West started to favour the Franks and began to refer to the Eastern Roman Empire largely as the Empire of the Greeks (Imperium Graecorum).","question":"When did the Byzantine Kingdom come under the impact of the Greeks.","answer":"influenced by Greek culture after the 7th century,","prediction":"Byzantine Empire – the Eastern Roman Empire","exact":0,"f1":0.133},{"task":"qa","id":"qa_0062238","source_text":"At E3 2007, Sony was able to show a number of their upcoming video games for PlayStation 3, including Heavenly Sword, Lair, Ratchet & Clank Future: Tools of Destruction, Warhawk and Uncharted: Drake's Fortune; all of which were released in the third and fourth quarters of 2007. They also showed off a number of titles that were set for release in 2008 and 2009; most notably Killzone 2, Infamous, Gran Turismo 5 Prologue, LittleBigPlanet and SOCOM: U.S. Navy SEALs Confrontation. A number of third-party exclusives were also shown, including the highly anticipated Metal Gear Solid 4: Guns of the Patriots, alongside other high-profile third-party titles such as Grand Theft Auto IV, Call of Duty 4: Modern Warfare, Assassin's Creed, Devil May Cry 4 and Resident Evil 5. Two other important titles for PlayStation 3, Final Fantasy XIII and Final Fantasy Versus XIII, were shown at TGS 2007 in order to appease the Japanese market.","question":"Which much anticipated third-party game with the name of a month of the year in it did Sony show at E3 2007?","answer":"Devil May Cry 4","prediction":"God of Steel","exact":0,"f1":0.0},{"task":"qa","id":"qa_0161600","source_text":"Zinc chemistry is similar to the chemistry of the late first-row transition metals nickel and copper, though it has a filled d-shell, so its compounds are diamagnetic and mostly colorless. The ionic radii of zinc and magnesium happen to be nearly identical. Because of this some of their salts have the same crystal structure and in circumstances where ionic radius is a determining factor zinc and magnesium chemistries have much in common. Otherwise there is little similarity. Zinc tends to form bonds with a greater degree of covalency and it forms much more stable complexes with N- and S- donors. Complexes of zinc are mostly 4- or 6- coordinate although 5-coordinate complexes are known.","question":"Whit what donors does zinc form stable complexes?","answer":"N- and S-","prediction":"nuclei and S-","exact":0,"f1":0.667},{"task":"qa","id":"qa_0164458","source_text":"Subjective idealists like George Berkeley are anti-realists in terms of a mind-independent world, whereas transcendental idealists like Immanuel Kant are strong skeptics of such a world, affirming epistemological and not metaphysical idealism. Thus Kant defines idealism as \"the assertion that we can never be certain whether all of our putative outer experience is not mere imagining\". He claimed that, according to idealism, \"the reality of external objects does not admit of strict proof. On the contrary, however, the reality of the object of our internal sense (of myself and state) is clear immediately through consciousness.\"  However, not all idealists restrict the real or the knowable to our immediate subjective experience. Objective idealists make claims about a transempirical world, but simply deny that this world is essentially divorced from or ontologically prior to the mental. Thus Plato and Gottfried Leibniz affirm an objective and knowable reality transcending our subjective awareness—a rejection of epistemological idealism—but propose that this reality is grounded in ideal entities, a form of metaphysical idealism. Nor do all metaphysical idealists agree on the nature of the ideal; for Plato, the fundamental entities were non-mental abstract forms, while for Leibniz they were proto-mental and concrete monads.","question":"What famous philosopher was a transcendental idealist?","answer":"Immanuel Kant","prediction":"Immanuel Kant","exact":1,"f1":1.0},{"task":"qa","id":"qa_0093070","source_text":"Prince Albert appears within the main arch above the twin entrances, Queen Victoria above the frame around the arches and entrance, sculpted by Alfred Drury. These façades surround four levels of galleries. Other areas designed by Webb include the Entrance Hall and Rotunda, the East and West Halls, the areas occupied by the shop and Asian Galleries as well as the Costume Gallery. The interior makes much use of marble in the entrance hall and flanking staircases, although the galleries as originally designed were white with restrained classical detail and mouldings, very much in contrast to the elaborate decoration of the Victorian galleries, although much of this decoration was removed in the early 20th century.","question":"Who designed the Entrance Hall and Rotunda?","answer":"Alfred Drury","prediction":"Alfred Drury","exact":1,"f1":1.0},{"task":"qa","id":"qa_0003742","source_text":"Ye Zhiping, the principal of Sangzao Middle School in Sangzao, one of the largest in An County, has been credited with proactive action that spared the lives of all 2,323 pupils in attendance when the earthquake happened. During a three-year period that ended in 2007, he oversaw a major overhaul of his school. During that time he obtained more than 400,000 yuan (US$60,000) from the county education department, money used to widen and strengthen concrete pillars and the balcony railing of all four storeys of his school, as well as secure its concrete floors.","question":"How many students attended the school?","answer":"2,323","prediction":"2,320","exact":0,"f1":0.0},{"task":"qa","id":"qa_0124047","source_text":"Modern editions of Old English manuscripts generally introduce some additional conventions. The modern forms of Latin letters are used, including ⟨g⟩ in place of the insular G, ⟨s⟩ for long S, and others which may differ considerably from the insular script, notably ⟨e⟩, ⟨f⟩ and ⟨r⟩. Macrons are used to indicate long vowels, where usually no distinction was made between long and short vowels in the originals. (In some older editions an acute accent mark was used for consistency with Old Norse conventions.) Additionally, modern editions often distinguish between velar and palatal ⟨c⟩ and ⟨g⟩ by placing dots above the palatals: ⟨ċ⟩, ⟨ġ⟩. The letter wynn ⟨ƿ⟩ is usually replaced with ⟨w⟩, but æsc, eth and thorn are normally retained (except when eth is replaced by thorn).","question":"What letter from the Latin alphabet replaces the Old English insular G?","answer":"g","prediction":"g","exact":1,"f1":1.0},{"task":"qa","id":"qa_0150661","source_text":"The baptism of Jesus and his crucifixion are considered to be two historically certain facts about Jesus. James Dunn states that these \"two facts in the life of Jesus command almost universal assent\" and \"rank so high on the 'almost impossible to doubt or deny' scale of historical facts\" that they are often the starting points for the study of the historical Jesus. Bart Ehrman states that the crucifixion of Jesus on the orders of Pontius Pilate is the most certain element about him. John Dominic Crossan states that the crucifixion of Jesus is as certain as any historical fact can be. Eddy and Boyd state that it is now \"firmly established\" that there is non-Christian confirmation of the crucifixion of Jesus. Craig Blomberg states that most scholars in the third quest for the historical Jesus consider the crucifixion indisputable. Christopher M. Tuckett states that, although the exact reasons for the death of Jesus are hard to determine, one of the indisputable facts about him is that he was crucified.","question":"What is one of the historical certain facts about Jesus?","answer":"baptism of Jesus","prediction":"the crucifixion of Jesus","exact":0,"f1":0.571}];const MAX_CUTOFF=256;const PAGE_SIZE=20;let gCutoff=64;</script>

<body>
<div class="hdr">
  <div class="hdr-top">
    <h1>Просмотр предсказаний модели</h1>
    <div class="controls">
      <div class="tabs" id="tabs">
        <button class="tab active" data-f="all">Все</button>
        <button class="tab" data-f="narrative">Narrative</button>
        <button class="tab" data-f="qa">QA</button>
      </div>
      <div class="slider-wrap" id="slider-wrap">
        <label>Cutoff:</label>
        <input type="range" id="slider" min="8" step="8">
        <strong id="cutoff-lbl"></strong> <span style="color:#a0aec0;font-size:12px">токенов</span>
      </div>
      <div class="search-wrap">
        <input type="text" id="search" placeholder="🔍 Поиск...">
      </div>
    </div>
  </div>
  <div class="metrics-bar" id="metrics-bar"></div>
</div>
<div class="stats-bar" id="stats-bar"></div>
<div class="content">
  <div id="cards"></div>
  <div class="pagination" id="pg"></div>
</div>

<script>
// ── helpers ────────────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function highlightAnswer(src, ans){
  if(!ans) return esc(src);
  const lo = src.toLowerCase(), al = ans.toLowerCase();
  const i = lo.indexOf(al);
  if(i===-1) return esc(src);
  return esc(src.slice(0,i))+'<mark class="ans-hl">'+esc(src.slice(i,i+ans.length))+'</mark>'+esc(src.slice(i+ans.length));
}

// ── state ──────────────────────────────────────────────────────────────────
let gFilter = "all", gPage = 0, gQuery = "";
let gFiltered = DATA;

function applyFilter(){
  const q = gQuery.toLowerCase();
  gFiltered = DATA.filter(d => {
    if(gFilter !== "all" && d.task !== gFilter) return false;
    if(!q) return true;
    const haystack = d.task==="narrative"
      ? (d.src_preview||"")
      : (d.source_text||"")+" "+(d.question||"")+" "+(d.answer||"")+" "+(d.prediction||"");
    return haystack.toLowerCase().includes(q);
  });
  gPage = 0;
  render();
}

// ── Metrics ────────────────────────────────────────────────────────────────
function computeMetrics(){
  const narItems = gFiltered.filter(d=>d.task==="narrative");
  const qaItems  = gFiltered.filter(d=>d.task==="qa");
  let html = "";

  if(narItems.length){
    let totMatched=0, totCmp=0;
    for(const d of narItems){
      const n = Math.min(gCutoff, d.matches.length);
      totMatched += d.matches.slice(0,n).filter(Boolean).length;
      totCmp += n;
    }
    const avg = totCmp ? totMatched/totCmp*100 : 0;
    const col = avg>=70?"#68d391":avg>=40?"#f6e05e":"#fc8181";
    html += `<div class="mg">
      <span class="mg-label" style="color:var(--nar-light)">Narrative</span>
      <div class="mi">
        <span class="mi-label">Avg Match @ ${gCutoff} tok</span>
        <div class="mi-row">
          <div class="mbar"><div class="mbar-fill" style="width:${avg.toFixed(0)}%;background:${col}"></div></div>
          <span class="mi-val" style="color:${col}">${avg.toFixed(1)}%</span>
        </div>
      </div>
      <span style="font-size:11px;color:#718096">${narItems.length} прим.</span>
    </div>`;
  }

  if(narItems.length && qaItems.length) html += '<div class="msep"></div>';

  if(qaItems.length){
    const valid = qaItems.filter(d=>d.exact!==-1);
    const em = valid.length ? valid.filter(d=>d.exact).length/valid.length*100 : -1;
    const f1 = valid.length ? valid.reduce((s,d)=>s+d.f1,0)/valid.length*100 : -1;
    const emCol = em>=50?"#68d391":em>=25?"#f6e05e":"#fc8181";
    const f1Col = f1>=60?"#68d391":f1>=30?"#f6e05e":"#fc8181";
    const emStr = em>=0?em.toFixed(1)+"%" :"—";
    const f1Str = f1>=0?f1.toFixed(1)+"%" :"—";
    const emW   = em>=0?em.toFixed(0):0;
    const f1W   = f1>=0?f1.toFixed(0):0;
    html += `<div class="mg">
      <span class="mg-label" style="color:var(--qa-light)">QA</span>
      <div class="mi">
        <span class="mi-label">Exact Match</span>
        <div class="mi-row">
          <div class="mbar"><div class="mbar-fill" style="width:${emW}%;background:${emCol}"></div></div>
          <span class="mi-val" style="color:${emCol}">${emStr}</span>
        </div>
      </div>
      <div class="mi">
        <span class="mi-label">F1 Score</span>
        <div class="mi-row">
          <div class="mbar"><div class="mbar-fill" style="width:${f1W}%;background:${f1Col}"></div></div>
          <span class="mi-val" style="color:${f1Col}">${f1Str}</span>
        </div>
      </div>
      <span style="font-size:11px;color:#718096">${qaItems.length} прим.</span>
    </div>`;
  }

  document.getElementById("metrics-bar").innerHTML = html||'<span style="color:#718096;font-size:12px">Нет данных</span>';
}

// ── render ─────────────────────────────────────────────────────────────────
function render(){
  const total  = gFiltered.length;
  const pages  = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(gPage >= pages) gPage = pages - 1;
  const start  = gPage * PAGE_SIZE;
  const slice  = gFiltered.slice(start, start + PAGE_SIZE);

  // metrics bar (cutoff-sensitive)
  computeMetrics();

  // stats bar
  const narN = gFiltered.filter(d=>d.task==="narrative").length;
  const qaN  = gFiltered.filter(d=>d.task==="qa").length;
  document.getElementById("stats-bar").textContent =
    `Показано: ${total} примеров  |  Narrative: ${narN}  |  QA: ${qaN}  |  Страница ${gPage+1} из ${pages}`;

  // slider visibility
  const hasNar = gFilter !== "qa";
  document.getElementById("slider-wrap").style.display = hasNar ? "flex" : "none";

  // cards
  const html = slice.length ? slice.map(renderCard).join("") : '<div class="empty">Ничего не найдено</div>';
  document.getElementById("cards").innerHTML = html;

  // expand buttons
  document.querySelectorAll(".expand-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const prev = btn.previousElementSibling;
      const expanded = prev.classList.toggle("expanded");
      btn.textContent = expanded ? "свернуть ▲" : "развернуть ▼";
    });
  });

  // pagination
  renderPagination(pages);
}

function renderCard(d){
  return d.task === "narrative" ? renderNarrative(d) : renderQA(d);
}

// ── Narrative ──────────────────────────────────────────────────────────────
function renderNarrative(d){
  const cutoff   = gCutoff;
  const cmpLen   = Math.min(cutoff, d.matches.length);
  const matched  = d.matches.slice(0, cmpLen).filter(Boolean).length;
  const pct      = cmpLen ? (matched/cmpLen*100).toFixed(1) : "—";
  const mbCls    = pct>=80?"mbadge-good":pct>=50?"mbadge-ok":"mbadge-bad";

  // Build token spans for prediction
  let tokHtml = "";
  for(let i=0; i<d.pred_tokens.length; i++){
    const t = esc(d.pred_tokens[i]);
    if(i === cutoff){
      tokHtml += '<span class="cutoff-marker" title="граница cutoff"></span>';
    }
    if(i >= cutoff){
      tokHtml += `<span class="tok-b">${t}</span>`;
    } else if(i < d.matches.length){
      tokHtml += `<span class="${d.matches[i]?'tok-m':'tok-x'}">${t}</span>`;
    } else {
      tokHtml += `<span class="tok-x">${t}</span>`;
    }
  }
  if(d.pred_total > MAX_CUTOFF){
    tokHtml += `<span class="tok-b"> …(ещё ${d.pred_total-MAX_CUTOFF} токенов)</span>`;
  }

  return `
<div class="card">
  <div class="card-hdr">
    <span class="badge badge-nar">Narrative</span>
    <span class="card-id">${esc(d.id)}</span>
    <div class="card-hdr-right">
      <span class="mbadge ${mbCls}">${matched}/${cmpLen} совпало (${pct}%)</span>
      <span class="len-pill">src ${d.src_total} tok</span>
      <span class="len-pill">pred ${d.pred_total} tok</span>
    </div>
  </div>
  <div class="section">
    <div class="sec-label">Исходный текст (цель)</div>
    <div class="src-preview">${esc(d.src_preview)}${d.src_preview.length>=800?"…":""}</div>
    <span class="expand-btn">развернуть ▼</span>
  </div>
  <div class="section">
    <div class="sec-label">Предсказание модели</div>
    <div class="tok-text">${tokHtml}</div>
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--match-bg)"></span>совпадает</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--miss-bg)"></span>не совпадает</span>
      <span class="legend-item"><span class="legend-swatch" style="background:#e2e8f0"></span>за пределами cutoff</span>
    </div>
  </div>
</div>`;
}

// ── QA ─────────────────────────────────────────────────────────────────────
function renderQA(d){
  const hasGT = d.exact !== -1;
  let scoreBadge = "";
  let ansCls = "";
  if(hasGT){
    const f1pct = (d.f1*100).toFixed(0);
    if(d.exact){
      scoreBadge = `<span class="qbadge qbadge-exact">Точное совпадение</span>`;
      ansCls = "exact-match";
    } else if(d.f1 >= 0.7){
      scoreBadge = `<span class="qbadge qbadge-good">F1 = ${f1pct}%</span>`;
      ansCls = "good-match";
    } else if(d.f1 >= 0.3){
      scoreBadge = `<span class="qbadge qbadge-ok">F1 = ${f1pct}%</span>`;
      ansCls = "bad-match";
    } else {
      scoreBadge = `<span class="qbadge qbadge-bad">F1 = ${f1pct}%</span>`;
      ansCls = "bad-match";
    }
  }

  const ctxHtml = highlightAnswer(d.source_text, d.answer);

  const ansRow = hasGT ? `
  <div class="section">
    <div class="qa-grid">
      <div>
        <div class="qa-box-label">Правильный ответ</div>
        <div class="qa-box">${esc(d.answer||"—")}</div>
      </div>
      <div>
        <div class="qa-box-label">Предсказание модели</div>
        <div class="qa-box ${ansCls}">${esc(d.prediction||"—")}</div>
      </div>
    </div>
  </div>` : `
  <div class="section">
    <div class="sec-label">Предсказание модели</div>
    <div class="qa-box">${esc(d.prediction||"—")}</div>
  </div>`;

  return `
<div class="card">
  <div class="card-hdr">
    <span class="badge badge-qa">QA</span>
    <span class="card-id">${esc(d.id)}</span>
    <div class="card-hdr-right">${scoreBadge}</div>
  </div>
  <div class="section">
    <div class="sec-label">Контекст <span class="len-pill">source_text</span></div>
    <div class="src-preview">${ctxHtml}</div>
    <span class="expand-btn">развернуть ▼</span>
  </div>
  <div class="section">
    <div class="sec-label">Вопрос</div>
    <div class="question-box">${esc(d.question)}</div>
  </div>
  ${ansRow}
</div>`;
}

// ── Pagination ─────────────────────────────────────────────────────────────
function renderPagination(pages){
  let html = "";
  html += `<button class="pg-btn" id="pg-prev" ${gPage===0?"disabled":""}>← Назад</button>`;
  html += `<span class="pg-info">Страница ${gPage+1} / ${pages}</span>`;
  html += `<button class="pg-btn" id="pg-next" ${gPage>=pages-1?"disabled":""}>Вперёд →</button>`;
  document.getElementById("pg").innerHTML = html;
  document.getElementById("pg-prev")?.addEventListener("click",()=>{ gPage--; render(); window.scrollTo(0,0); });
  document.getElementById("pg-next")?.addEventListener("click",()=>{ gPage++; render(); window.scrollTo(0,0); });
}

// ── Events ─────────────────────────────────────────────────────────────────
const slider = document.getElementById("slider");
const lbl    = document.getElementById("cutoff-lbl");
slider.max   = MAX_CUTOFF;
slider.value = gCutoff;
lbl.textContent = gCutoff;

slider.addEventListener("input", ()=>{
  gCutoff = +slider.value;
  lbl.textContent = gCutoff;
  render();
});

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    gFilter = tab.dataset.f;
    applyFilter();
  });
});

let searchTimer;
document.getElementById("search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ gQuery = e.target.value; applyFilter(); }, 300);
});

// ── Init ───────────────────────────────────────────────────────────────────
applyFilter();
</script>
</body>
</html>
