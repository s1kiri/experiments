experiment:
  name: perceiver_ctx16_full_ft
  seed: 20222022
  output_dir: runs

data:
  batch_size: 16
  num_workers: 4
  n_samples_train: 1000000
  n_samples_val: 5000

models:
  cache_dir: model_cache   # local path (experiments/model_cache/)

  embedder:
    name: Qwen/Qwen3-Embedding-0.6B
    trainable: true
    max_length: 512

  mapper:
    class: PerceiverMapper
    params:
      in_dim: 1024
      out_dim: 1024
      n_ctx_tokens: 16
      n_heads: 8
      n_layers: 2
    trainable: true

  llm:
    name: Qwen/Qwen3-0.6B
    trainable: true
    max_length: 256

training:
  lr: 0.0001
  warmup_steps: 200
  max_epochs: 10
  gradient_clip_val: 1.0
  precision: "bf16"
  num_vals_per_epoch: 4

logging:
  tensorboard: true
  log_every_n_steps: 10

compute:
  device: cpu
  target_metric: null

debug: false
val_generate: true

soft_prompt:
  n_tokens: 0

checkpointing:
  enabled: true
  monitor: "val/loss"
  mode: "min"
  save_top_k: 3
  save_last: true
