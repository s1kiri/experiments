experiment:
  name: pooled_qwen_trainable_emb_ctx16   # rename per run: ctx1 → ctx4 → ctx8 → ctx16 → ctx32
  seed: 20222022
  output_dir: runs/

data:
  batch_size: 16           # safe on H100; try 32 after verifying no OOM
  num_workers: 16
  n_samples_train: 1000000  # increase / decrease as needed
  n_samples_val: 5000        # kept small so val+generate stays fast

models:
  cache_dir: model_cache    # local dir for downloaded weights; null → use HF default cache

  embedder:
    name: Qwen/Qwen3-Embedding-0.6B
    trainable: true
    max_length: 512

  mapper:
    class: PooledMLPMapper
    params:
      in_dim: 1024
      out_dim: 1024
      n_ctx_tokens: 16      # experimental axis: 1 → 4 → 8 → 16 → 32
    trainable: true

  llm:
    name: Qwen/Qwen3-0.6B
    trainable: true
    max_length: 256
    # ── LoRA (optional) ────────────────────────────────────────────────────
    # Uncomment to use LoRA instead of full LLM fine-tuning.
    # Set trainable: false above when enabling LoRA (base weights stay frozen).
    # lora:
    #   r: 16
    #   alpha: 32
    #   target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    #   dropout: 0.0

training:
  lr: 0.0001
  warmup_steps: 200         # linear warmup then cosine decay
  max_epochs: 10
  gradient_clip_val: 1.0
  precision: "bf16"         # H100 native; do NOT use 16 (fp16 GradScaler breaks on bf16 weights)
  num_vals_per_epoch: 4     # GPU: validate 4× per epoch (every 25%); CPU: always 1× (auto)

logging:
  tensorboard: true
  log_every_n_steps: 10

compute:
  device: cpu               # training device: "cpu" | "cuda:0" | "cuda:1" | ...
  target_metric: null

debug: false                # true → verbose prints in forward/collate (shapes, stats, decoded targets)
val_generate: true          # false → skip free generation in validation (faster CPU iteration)

# ── Soft-prompt (optional) ───────────────────────────────────────────────────
# Learnable vectors inserted inside the user turn, after </CONTEXT> and before <|im_end|>.
# Works best with trainable: false on the LLM (frozen backbone + learned prompt).
soft_prompt:
  n_tokens: 0   # 0 = disabled; e.g. 20 for 20 learnable soft-prompt vectors

checkpointing:
  enabled: true
  monitor: "val/loss"       # metric to track for top-k selection
  mode: "min"               # "min" for loss, "max" for accuracy-like metrics
  save_top_k: 3             # keep 3 best checkpoints + last
  save_last: true           # always keep last.ckpt (for resuming)
  # Checkpoints are saved to: <output_dir>/<experiment.name>/version_N/checkpoints/
