experiment:
  name: perceiver_ctx4_mapper_only   # ← меняй: ctx4 / ctx8 / ctx16 / ctx32
  seed: 20222022
  output_dir: /data/ksidorsky/experiments/runs

data:
  batch_size: 16
  num_workers: 16
  n_samples_train: 1000000
  n_samples_val: 2500

models:
  cache_dir: /home/ksidorsky/experiments_new/model_cache

  embedder:
    name: Qwen/Qwen3-Embedding-0.6B
    trainable: false
    max_length: 512

  mapper:
    class: PerceiverMapper        # cross-attention resampler (most expressive)
    params:
      in_dim: 1024
      out_dim: 1024
      n_ctx_tokens: 4      # ← experimental axis: 4 → 8 → 16 → 32 (min ≥ n_heads)
      n_heads: 8
      n_layers: 2
    trainable: true

  llm:
    name: Qwen/Qwen3-0.6B
    trainable: false               # full fine-tuning
    max_length: 256

training:
  lr: 0.0001
  warmup_steps: 200
  max_epochs: 1
  gradient_clip_val: 1.0
  precision: "bf16"
  num_vals_per_epoch: 4

logging:
  tensorboard: true
  log_every_n_steps: 10

compute:
  device: cuda:5
  target_metric: null

debug: false
val_generate: true

soft_prompt:
  n_tokens: 0

checkpointing:
  enabled: true
  monitor: "val/loss"
  mode: "min"
  save_top_k: 3
  save_last: true
