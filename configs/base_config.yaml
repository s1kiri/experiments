experiment:
  name: mlp_run
  seed: 42
  output_dir: runs/

data:
  batch_size: 1
  num_workers: 4
  n_samples: 1000   # total examples drawn from dataset["train"]; 90% → train, 10% → val (stratified by task)

models:
  cache_dir: model_cache   # local dir for downloaded weights; null → use HF default cache

  embedder:
    name: bert-base-uncased
    trainable: false
    max_length: 512

  mapper:
    class: BaseMapper
    params:
      in_dim: 768
      out_dim: 768
    trainable: true

  llm:
    name: gpt2
    trainable: false
    max_length: 256

training:
  lr: 0.0001
  max_epochs: 3
  gradient_clip_val: 1.0
  precision: 16

logging:
  tensorboard: true
  log_every_n_steps: 10

compute:
  device: cpu            # training device: "cpu" | "cuda:0" | "cuda:1" | ...
  target_metric: null   # или число, если считаем compute-to-quality
